name: Release

# Pushing a version tag (e.g. v0.1) builds the app and publishes it as a
# GitHub release. The tag must match CFBundleShortVersionString in Info.plist.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Info.plist version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The version's section of CHANGELOG.md, without its heading.
      - name: Read the notes
        run: |
          awk -v v="## $VERSION" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > build-notes.md
          if ! grep -q '[^[:space:]]' build-notes.md; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build
        run: make release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## What's new"
            cat build-notes.md
            echo
            echo "## Installing"
            echo
            echo "Universal build for macOS 13 or later (Apple Silicon and Intel).

          The app is signed ad hoc, not notarized, so macOS blocks it the first time. Move it to Applications, try to open it, then click **Open Anyway** in System Settings → Privacy & Security (or run \`xattr -dr com.apple.quarantine /Applications/Souris\ facile\ pomme.app\`). Then grant it Accessibility access when asked."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "build/SourisFacilePomme-$VERSION.zip" \
            --title "Souris facile pomme $VERSION" \
            --notes-file notes.md
