name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
      - name: Build the app
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: SourisFacilePomme
          path: build/SourisFacilePomme-*.zip
